apiVersion: apps/v1
kind: Deployment
metadata:
  name: elara-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elara-admin
  template:
    metadata:
      labels:
        app: elara-admin
    spec:
      containers:
        - name: admin-frontend
          image: anuraggurjar96/projectelara-admin-frontend:mt2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: elara-admin
spec:
  selector:
    app: elara-admin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31985
  type: NodePort

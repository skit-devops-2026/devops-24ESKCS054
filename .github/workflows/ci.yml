name: ELARA CI

on:
  push:
    branches:
      - main
      - ci-pipeline
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            User/package-lock.json
            admin/package-lock.json

      - name: Install User dependencies
        working-directory: User
        run: npm ci

      - name: Lint User application
        working-directory: User
        run: npm run lint || true

      - name: Build User application
        working-directory: User
        run: npm run build

      - name: Install Admin dependencies
        working-directory: admin
        run: npm ci

      - name: Lint Admin application
        working-directory: admin
        run: npm run lint || true

      - name: Build Admin application
        working-directory: admin
        run: npm run build

      - name: Run automated tests
        run: node tests/basic.test.js


services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: anuraggurjar96/projectelara-backend:mt2
    env_file:
      - backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  user-frontend:
    build:
      context: .
      dockerfile: User/Dockerfile
    image: anuraggurjar96/projectelara-user-frontend:mt2
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  admin-frontend:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: anuraggurjar96/projectelara-admin-frontend:mt2
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
